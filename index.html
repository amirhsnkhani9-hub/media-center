:root{--navy:#0a1628;--navy2:#10223d;--card:#132a4a;--line:rgba(255,255,255,.09);--primary:#2f6fed;--turq:#2dd4bf;--accent:#e5b84b;--text:#eef3fb;--mute:#9db0cc;--ok:#34d399;--warn:#fbbf24;--bad:#f87171;
--font-heading:'BonyadKoodak',Tahoma,'Segoe UI',sans-serif;--font-body:'Hamrah',Tahoma,'Segoe UI',sans-serif;--r:16px;--sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;margin:0}
html{direction:rtl;-webkit-text-size-adjust:100%}
body{direction:rtl;font-family:var(--font-body);background:radial-gradient(1200px 500px at 85% -10%,rgba(47,111,237,.25),transparent),var(--navy);color:var(--text);line-height:1.8;min-height:100vh;overflow-x:hidden}
h1,h2,h3,h4,.num,.btn-h{font-family:var(--font-heading);font-weight:700;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
.app{display:flex;min-height:100vh}
.sidebar{display:none;width:250px;flex:none;background:var(--navy2);border-inline-end:1px solid var(--line);padding:calc(18px + var(--sat)) 14px;position:sticky;top:0;height:100vh;overflow:auto}
.main-col{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;padding:calc(10px + var(--sat)) 16px 10px;background:rgba(10,22,40,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.topbar .logo{width:38px;height:38px;border-radius:12px;object-fit:cover;background:var(--card)}
.topbar h1{font-size:1.05rem;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
main{flex:1;padding:18px 16px calc(96px + var(--sab));max-width:1200px;width:100%;margin-inline:auto;outline:none}
.footer{padding:14px 16px calc(80px + var(--sab));text-align:center;color:var(--mute);font-size:.85rem}
.brand{display:flex;gap:10px;align-items:center;margin-bottom:18px}
.nav-item{display:flex;align-items:center;gap:10px;width:100%;min-height:44px;padding:8px 12px;border:0;border-radius:12px;background:none;color:var(--mute);cursor:pointer;text-align:start}
.nav-item:hover,.nav-item:focus-visible{background:rgba(255,255,255,.06);color:var(--text)}
.nav-item.on{background:linear-gradient(90deg,rgba(45,212,191,.16),rgba(47,111,237,.16));color:#fff;box-shadow:inset -3px 0 var(--turq)}
.bottom-nav{position:fixed;inset-inline:0;bottom:0;z-index:30;display:flex;background:var(--navy2);border-top:1px solid var(--line);padding-bottom:var(--sab)}
.bottom-nav .nav-item{flex-direction:column;gap:0;justify-content:center;font-size:.72rem;border-radius:0;box-shadow:none!important;padding:6px 2px;text-align:center}
.bottom-nav .nav-item.on{color:var(--turq);background:none}
.ico{font-size:1.25rem;line-height:1}
.fab{position:fixed;inset-inline-start:16px;bottom:calc(76px + var(--sab));z-index:31;width:56px;height:56px;border-radius:50%;border:0;background:var(--accent);color:#1a1300;font-size:1.8rem;box-shadow:0 8px 24px rgba(0,0,0,.4);cursor:pointer}
.fab[hidden]{display:none}
.card{background:linear-gradient(180deg,rgba(255,255,255,.04),rgba(255,255,255,.015)),var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:0 2px 10px rgba(0,0,0,.18)}
.hero{background:linear-gradient(135deg,#17386b,#0f2a4f 60%,#0d3b43);border-color:rgba(45,212,191,.3);position:relative;overflow:hidden}
.hero h2{font-size:1.5rem;margin:6px 0}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr))}
.stats{grid-template-columns:repeat(auto-fit,minmax(130px,1fr))}
.stat{text-align:center;padding:14px 8px}
.stat .num{font-size:2rem;color:var(--turq);display:block}
.stat.gold .num{color:var(--accent)}

document.addEventListener('click',e=>{const lk=e.target.closest('a[href^="#/"]');if(lk){e.preventDefault();go(lk.getAttribute('href').slice(2))}});

/* ===== Events (delegated) ===== */
document.addEventListener('click',e=>{const t=e.target.closest('[data-a],[data-nav],[data-menu],[data-close],[data-tab],#fab,#drawer');if(!t)return;
 if(t.id==='drawer'&&e.target===t){t.hidden=true;return}
 if(t.dataset.close!==undefined){closeModal();return}
 if(t.dataset.menu!==undefined){$('#drawer').hidden=false;return}
 if(t.dataset.nav){$('#drawer').hidden=true;go(t.dataset.nav);return}
 if(t.dataset.tab){const[k,v]=t.dataset.tab.split('|');UI.tab[k]=v;render();return}
 if(t.id==='fab'){if(!RO)addNew(t.dataset.c);return}
 const{a,c,id}=t.dataset,col=c;if(RO&&MUT.includes(a))return;
 if(a==='add')addNew(col);
 else if(a==='addc')openForm(col,null,{ideaId:id});
 else if(a==='edit')openForm(col,id);
 else if(a==='del')confirmBox('آیا از حذف این مورد مطمئن هستید؟','حذف',()=>{if(col==='ideas'){['ideaMembers','ideaEquipment','ideaSteps','checklistItems'].forEach(k=>DS.getAll(k).filter(x=>x.ideaId===id).forEach(x=>DS.delete(k,x.id)));ROUTE='ideas';try{location.hash='#/ideas'}catch{}}DS.delete(col,id);toast('با موفقیت حذف شد.');render()});
 else if(a==='dup'){const o=DS.getById(col,id),n=DS.create(col,{...o,id:undefined,title:o.title+' (کپی)'});['ideaMembers','ideaEquipment','ideaSteps','checklistItems'].forEach(k=>DS.getAll(k).filter(x=>x.ideaId===id).forEach(x=>DS.create(k,{...x,id:undefined,ideaId:n.id,done:false})));toast('ایده تکثیر شد.');render()}
 else if(a==='pin'){const o=DS.getById(col,id);DS.update(col,id,{pinned:!o.pinned});render()}
 else if(a==='tick'){DS.update('checklistItems',id,{done:t.checked});render()}
 else if(a==='setst'){DS.update('ideas',id,{status:t.dataset.v});toast('وضعیت به‌روز شد.');render()}
 else if(a==='txreset')confirmBox('همه متن‌ها به حالت پیش‌فرض برگردد؟','بازگردانی',()=>{DS.update('settings','main',{texts:{}});loadTX();toast('بازگردانی شد.');render()});else if(a==='logout')logout();else if(a==='newpass')passForm();else if(a==='build')buildHtml();else if(a==='export'){const b=new Blob([JSON.stringify(DS.exportAll(),null,2)],{type:'application/json'}),l=document.createElement('a');l.href=URL.createObjectURL(b);l.download='media-command-center-backup.json';l.click();toast('فایل پشتیبان آماده شد.')}
 else if(a==='reset')confirmBox('همه داده‌ها حذف و داده‌های نمونه بازگردانی می‌شود. مطمئن هستید؟','بازنشانی',()=>{resetAll();toast('بازنشانی انجام شد.');render()})});
function addNew(col){if(!col)return;if(col==='simpleNotes'){const n=DS.create('simpleNotes',{title:'',text:'',pinned:false});noteEditor(n.id);return}openForm(col,null,col==='newNotes'?{status:'جدید',date:new Date().toLocaleDateString('fa-IR')}:{})}
function noteEditor(id){const n=DS.getById('simpleNotes',id);openModal(`<h2>${T('دفترچه یادداشت')}</h2><label class="f"><span>${T('عنوان')}</span><input id="nt" value="${esc(n.title)}"></label><label class="f"><span>${T('متن آزاد')}</span><textarea id="nx" style="min-height:240px">${esc(n.text)}</textarea></label><p class="mute" id="ns">ذخیره خودکار فعال است · ${fa(n.updatedAt)}</p><div class="acts"><button class="btn pri" data-close>${T('بستن')}</button></div>`);
 let h;const sv=()=>{clearTimeout(h);h=setTimeout(()=>{const u=DS.update('simpleNotes',id,{title:$('#nt').value,text:$('#nx').value});$('#ns').textContent='ذخیره شد · '+fa(u.updatedAt)},300)};$('#nt').oninput=sv;$('#nx').oninput=sv}
document.addEventListener('click',e=>{const b=e.target.closest('[data-a="edit"][data-c="simpleNotes"]');if(b&&!RO){e.stopImmediatePropagation();closeModal();noteEditor(b.dataset.id)}},true);
$('#modal').addEventListener('click',e=>{if(e.target.id==='modal'){const w=$('#nt');closeModal();route().page==='simple'&&render()}});
document.addEventListener('click',e=>{if(e.target.closest('#modal [data-close]'))route().page==='simple'&&setTimeout(render,0)});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeModal();$('#drawer').hidden=true}});
document.addEventListener('input',e=>{const t=e.target;if(t.dataset.q){UI.q[t.dataset.q]=t.value;const p=t.selectionStart;render();const n=$(`[data-q="${t.dataset.q}"]`);n&&(n.focus(),n.setSelectionRange(p,p))}});
document.addEventListener('change',e=>{const t=e.target;
 if(t.dataset.fl){const[c,k]=t.dataset.fl.split('|');(UI.f[c]=UI.f[c]||{})[k]=t.value;render()}
 else if(t.dataset.tx!==undefined&&!RO){const o={...TX},v=t.value.trim();v?o[t.dataset.tx]=v:delete o[t.dataset.tx];DS.update('settings','main',{texts:o});loadTX();toast('متن ذخیره شد.');render()}else if(t.dataset.sort){UI.s[t.dataset.sort]=t.value;render()}
 else if(t.dataset.a==='status'&&!RO){DS.update('ideas',t.dataset.id,{status:t.value});toast('وضعیت به‌روز شد.');render()}
 else if(t.id==='imp'&&t.files[0]&&!RO){const r=new FileReader();r.onload=()=>{try{const o=JSON.parse(r.result);if(o.app!=='media-command-center')throw 0;confirmBox('با Import، اطلاعات فعلی جایگزین می‌شود. ادامه می‌دهید؟','Import',()=>{DS.importAll(o);toast('اطلاعات با موفقیت بازیابی شد.');render()})}catch{toast('فایل JSON نامعتبر است.',1)}};r.readAsText(t.files[0])}});
window.addEventListener('hashchange',()=>{const h=location.hash.replace(/^#\/?/,'');if(h!==ROUTE){ROUTE=h;closeModal();render()}});
try{if(tg){tg.ready();tg.expand();tg.BackButton.onClick(()=>go('ideas'));try{tg.setHeaderColor('#0a1628');tg.setBackgroundColor('#0a1628')}catch{}}}catch{}
boot();applyRO();
render();
})();

</script>
</body>
</html>
